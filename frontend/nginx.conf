server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # BACKEND_URL: http://backend:8000 en Docker Compose, la URL pública del backend en Railway.
        # El Host que se envía es el del backend (Railway enruta por ese nombre).
        proxy_pass ${BACKEND_URL}/api/;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Respaldos: una restauración tarda cerca de un minuto y el .zip puede pesar varios MB.
        proxy_read_timeout 300s;
        client_max_body_size 200m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
